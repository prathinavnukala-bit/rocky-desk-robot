[env:esp32cam]
platform = espressif32
board = esp32cam
framework = arduino

monitor_speed = 115200
upload_speed = 115200

; upload_port auto-detected (any USB serial adapter)
; monitor_port auto-detected

; Over-the-air flashing (after the first USB flash of this firmware):
;   pio run -e ota -t upload
; Builds, then tools/ota_push.py posts the image to rocky-cam.local:8080.
[env:ota]
extends = env:esp32cam
upload_protocol = custom
upload_command = python3 tools/ota_push.py $SOURCE
