[env:esp32-s3-devkitc-1]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino

board_build.arduino.memory_type = qio_opi
board_build.flash_mode = qio
board_build.psram_type = opi
board_upload.flash_size = 16MB
board_upload.maximum_size = 16777216

build_flags =
    -DBOARD_HAS_PSRAM
    -DARDUINO_USB_CDC_ON_BOOT=1

monitor_speed = 115200
upload_speed = 460800
upload_port = /dev/cu.usbmodem101

lib_deps =
    adafruit/Adafruit PWM Servo Driver Library
    adafruit/Adafruit SSD1306
    adafruit/Adafruit GFX Library
    spaziochirale/Chirale_TensorFlowLite

; Over-the-air flashing -- the way to update the firmware once the enclosure
; is closed:   pio run -e ota -t upload
; It builds, then tools/ota_push.py POSTs the image to the board over Wi-Fi
; (the Mac connects OUT to the board, so the macOS firewall does not get in the
; way). The board is found as rocky-body.local, with a subnet scan as a
; fallback. Token = OTA_PASSWORD in src/main.cpp and TOKEN in the script.
[env:ota]
extends = env:esp32-s3-devkitc-1
upload_protocol = custom
upload_command = python3 tools/ota_push.py $SOURCE
